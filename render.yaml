services:
  # Single Full-Stack Web Service (Express Backend + React SPA Static Files)
  - type: web
    name: twite-ai-1
    env: node
    buildCommand: npm install --prefix backend && npm install --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 1d

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "28337"

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_NAME
        sync: false

      - key: DB_SSL
        value: "true"